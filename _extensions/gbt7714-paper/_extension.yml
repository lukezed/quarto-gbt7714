title: GB/T 7714 Paper
author: lukezed
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      toc: false
      number-sections: true
      filters:
        - path: blind.lua
          at: pre-ast
        - path: layout.lua
          at: pre-ast
        - ../gbt7714/gbt7714.lua
        - path: journal-tables.lua
          at: post-quarto
    html:
      theme: cosmo
      css: paper.css
      title-block-banner: false
      anchor-sections: true
    pdf:
      pdf-engine: xelatex
      documentclass: ctexart
      classoption:
        - fontset=fandol
      papersize: a4
      fontsize: 12pt
      geometry:
        - margin=25.4mm
      include-in-header: paper.tex
    docx:
      reference-doc: paper-reference.docx
